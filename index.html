<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLESS XHTTP Converter — Podkop Edition</title>
    <meta name="description"
        content="Конвертер VLESS XHTTP + Reality/TLS ссылок в sing-box JSON конфигурацию для Podkop">
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%2306b6d4'/%3E%3Cstop offset='100%25' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Cpath d='M18 22l10 20L38 22' stroke='url(%23g)' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M38 28h8m-8 6h8m-8 6h6' stroke='%2306b6d4' stroke-width='3' fill='none' stroke-linecap='round' opacity='0.7'/%3E%3C/svg%3E">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #07090f;
            --bg-secondary: #0c1019;
            --bg-card: rgba(15, 20, 35, 0.7);
            --bg-input: #080b14;
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(6, 182, 212, 0.25);
            --text-primary: #e8edf5;
            --text-secondary: #8892a8;
            --text-muted: #4a5568;
            --accent-cyan: #06d6a0;
            --accent-purple: #8b5cf6;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #f43f5e;
            --accent-amber: #f59e0b;
            --glow-primary: rgba(6, 214, 160, 0.08);
            --glow-purple: rgba(139, 92, 246, 0.06);
            --radius: 14px;
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 50px 20px 40px;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse 800px 600px at 20% 10%, var(--glow-primary) 0%, transparent 70%),
                radial-gradient(ellipse 600px 500px at 80% 80%, var(--glow-purple) 0%, transparent 70%),
                radial-gradient(ellipse 400px 300px at 50% 50%, rgba(59, 130, 246, 0.03) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: bgPulse 20s ease-in-out infinite alternate;
        }

        /* Grid pattern overlay */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes bgPulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }

            100% {
                opacity: 1;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 780px;
        }

        /* ─── Header ─── */
        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .header-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 18px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 0 40px rgba(6, 214, 160, 0.2),
                0 0 80px rgba(6, 214, 160, 0.05);
            animation: iconFloat 4s ease-in-out infinite;
        }

        @keyframes iconFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-4px);
            }
        }

        .header-icon svg {
            width: 28px;
            height: 28px;
        }

        .header h1 {
            font-size: 1.75em;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #fff;
            margin-bottom: 6px;
        }

        .header h1 .gradient-text {
            background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(6, 214, 160, 0.08);
            border: 1px solid rgba(6, 214, 160, 0.2);
            color: var(--accent-cyan);
            font-size: 0.55em;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            vertical-align: middle;
            margin-left: 8px;
            -webkit-text-fill-color: var(--accent-cyan);
        }

        .header .subtitle {
            color: var(--text-muted);
            font-size: 0.88em;
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        .header .subtitle span {
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* ─── Cards ─── */
        .card {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 16px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .card:hover {
            border-color: var(--border-hover);
            box-shadow: 0 0 40px rgba(6, 214, 160, 0.04);
        }

        .card-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.72em;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 16px;
        }

        .card-label .icon-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: rgba(6, 214, 160, 0.08);
        }

        .card-label svg {
            width: 14px;
            height: 14px;
            color: var(--accent-cyan);
        }

        /* ─── Input ─── */
        textarea {
            width: 100%;
            height: 90px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 0.82em;
            padding: 16px;
            border-radius: 10px;
            resize: vertical;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            line-height: 1.7;
        }

        textarea::placeholder {
            color: var(--text-muted);
            font-size: 0.95em;
        }

        textarea:focus {
            border-color: rgba(6, 214, 160, 0.4);
            box-shadow: 0 0 0 3px rgba(6, 214, 160, 0.06), 0 0 20px rgba(6, 214, 160, 0.05);
        }

        /* ─── Button ─── */
        .btn-wrapper {
            position: relative;
            margin-top: 16px;
        }

        .btn {
            position: relative;
            width: 100%;
            padding: 15px 24px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #fff;
            border: none;
            font-family: var(--font-sans);
            font-size: 0.88em;
            font-weight: 700;
            cursor: pointer;
            border-radius: 10px;
            letter-spacing: 0.02em;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            overflow: hidden;
            z-index: 1;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 0%, rgba(255, 255, 255, 0.12) 50%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow:
                0 8px 25px rgba(6, 214, 160, 0.25),
                0 0 60px rgba(6, 214, 160, 0.1);
        }

        .btn:hover::before {
            opacity: 1;
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn svg {
            width: 16px;
            height: 16px;
            transition: transform 0.3s;
        }

        .btn:hover svg {
            transform: rotate(90deg);
        }

        /* ─── Output ─── */
        .output-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .copy-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-family: var(--font-sans);
            font-size: 0.72em;
            font-weight: 600;
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 0.02em;
        }

        .copy-btn:hover {
            background: rgba(6, 214, 160, 0.08);
            border-color: rgba(6, 214, 160, 0.25);
            color: var(--accent-cyan);
        }

        .copy-btn.copied {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            color: var(--accent-green);
        }

        .copy-btn svg {
            width: 13px;
            height: 13px;
        }

        pre {
            width: 100%;
            min-height: 100px;
            max-height: 480px;
            background: var(--bg-input);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 0.8em;
            line-height: 1.75;
            padding: 20px;
            margin: 0;
            overflow: auto;
            white-space: pre-wrap;
            border: 1px solid var(--border);
            border-radius: 10px;
            transition: border-color 0.3s;
        }

        pre::-webkit-scrollbar {
            width: 5px;
        }

        pre::-webkit-scrollbar-track {
            background: transparent;
        }

        pre::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
        }

        pre::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Syntax colors */
        pre .key {
            color: #67e8f9;
        }

        pre .string {
            color: #fbbf24;
        }

        pre .number {
            color: var(--accent-green);
        }

        pre .boolean {
            color: var(--accent-purple);
        }

        pre .null {
            color: var(--text-muted);
        }

        .placeholder-text {
            color: var(--text-muted);
            font-family: var(--font-sans);
            font-style: italic;
            font-size: 0.9em;
        }

        .error-text {
            color: var(--accent-red);
            font-family: var(--font-sans);
        }

        /* ─── Toast ─── */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--accent-green);
            font-family: var(--font-sans);
            font-size: 0.82em;
            font-weight: 600;
            padding: 10px 22px;
            border-radius: 10px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ─── Stats bar ─── */
        .stats-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 14px;
            opacity: 0;
            transform: translateY(6px);
            transition: all 0.4s ease;
        }

        .stats-bar.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .stat-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            font-family: var(--font-mono);
            font-size: 0.68em;
            font-weight: 500;
            color: var(--text-secondary);
            padding: 4px 10px;
            border-radius: 6px;
        }

        .stat-chip .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot-green {
            background: var(--accent-green);
            box-shadow: 0 0 6px rgba(16, 185, 129, 0.5);
        }

        .dot-purple {
            background: var(--accent-purple);
            box-shadow: 0 0 6px rgba(139, 92, 246, 0.5);
        }

        .dot-amber {
            background: var(--accent-amber);
            box-shadow: 0 0 6px rgba(245, 158, 11, 0.5);
        }

        .dot-cyan {
            background: var(--accent-cyan);
            box-shadow: 0 0 6px rgba(6, 214, 160, 0.5);
        }

        /* ─── Footer ─── */
        .footer {
            text-align: center;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.72em;
            letter-spacing: 0.01em;
        }

        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.25s;
            font-weight: 500;
        }

        .footer a:hover {
            color: var(--accent-cyan);
        }

        .footer .divider {
            margin: 0 8px;
            opacity: 0.3;
        }

        /* ─── Responsive ─── */
        @media (max-width: 640px) {
            body {
                padding: 24px 14px 30px;
            }

            .card {
                padding: 18px;
                border-radius: 12px;
            }

            .header h1 {
                font-size: 1.35em;
            }

            .header-icon {
                width: 46px;
                height: 46px;
                border-radius: 13px;
            }

            textarea {
                font-size: 0.78em;
                height: 80px;
            }

            pre {
                font-size: 0.72em;
                padding: 14px;
            }

            .badge {
                font-size: 0.5em;
            }
        }

        /* ─── Animate card entrance ─── */
        .card {
            animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) backwards;
        }

        .card:nth-child(2) {
            animation-delay: 0.1s;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <div class="header-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"
                    stroke-linejoin="round">
                    <polyline points="4 4 10 16 16 4"></polyline>
                    <line x1="16" y1="10" x2="20" y2="10"></line>
                    <line x1="16" y1="14" x2="20" y2="14"></line>
                </svg>
            </div>
            <h1><span class="gradient-text">VLESS Converter</span><span class="badge">Podkop</span></h1>
            <p class="subtitle"><span>XHTTP</span> + Reality / TLS → <span>sing-box JSON</span></p>
        </div>

        <div class="card">
            <div class="card-label">
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                    </svg>
                </div>
                Входная ссылка
            </div>
            <textarea id="urlInput" placeholder="vless://uuid@server:port?type=xhttp&security=reality&...#tag"
                spellcheck="false"></textarea>
            <div class="btn-wrapper">
                <button class="btn" onclick="convertURL()" id="convertBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <polyline points="16 3 21 3 21 8"></polyline>
                        <line x1="4" y1="20" x2="21" y2="3"></line>
                        <polyline points="21 16 21 21 16 21"></polyline>
                        <line x1="15" y1="15" x2="21" y2="21"></line>
                        <line x1="4" y1="4" x2="9" y2="9"></line>
                    </svg>
                    Конвертировать
                </button>
            </div>
        </div>

        <div class="card" id="outputCard">
            <div class="output-header">
                <div class="card-label" style="margin-bottom: 0;">
                    <div class="icon-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="16 18 22 12 16 6"></polyline>
                            <polyline points="8 6 2 12 8 18"></polyline>
                        </svg>
                    </div>
                    Результат
                </div>
                <button class="copy-btn" id="copyBtn" onclick="copyJSON()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                    <span id="copyText">Копировать</span>
                </button>
            </div>
            <pre id="jsonOutput"><span class="placeholder-text">JSON конфигурация появится здесь...</span></pre>
            <div class="stats-bar" id="statsBar"></div>
        </div>

        <div class="footer">
            Создано для <a href="https://github.com/itdoginfo/podkop" target="_blank">Podkop</a>
            <span class="divider">•</span>
            sing-box outbound config generator
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">✓ Скопировано в буфер обмена</div>

    <script>
        function convertURL() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const outputElement = document.getElementById('jsonOutput');
            const statsBar = document.getElementById('statsBar');

            if (!urlInput.startsWith('vless://')) {
                outputElement.innerHTML = '<span class="error-text">❌ Ссылка должна начинаться с vless://</span>';
                statsBar.classList.remove('visible');
                return;
            }

            try {
                const url = new URL(urlInput);
                const params = new URLSearchParams(url.search);

                const uuid = url.username;
                const server = url.hostname;
                const port = parseInt(url.port, 10) || 443;
                let tag = url.hash ? decodeURIComponent(url.hash.substring(1)) : "VLESS-XHTTP";

                const type = params.get('type') || 'xhttp';
                const path = params.get('path') || '/';
                const mode = params.get('mode') || 'auto';
                const xPaddingBytes = params.get('x_padding_bytes') || '100-1000';
                const sni = params.get('sni') || '';
                const host = params.get('host') || sni;

                const security = params.get('security');
                const isReality = (security === 'reality');
                const isTls = (security === 'tls');

                const pbk = params.get('pbk') || '';
                const sid = params.get('sid') || '';
                const fp = params.get('fp') || 'chrome';

                let alpnArray = [];
                const alpnRaw = params.get('alpn');
                if (alpnRaw) {
                    alpnArray = decodeURIComponent(alpnRaw).split(',');
                } else {
                    if (type === 'xhttp') alpnArray = ["h2", "http/1.1"];
                }

                const tlsSettings = {
                    "enabled": true,
                    "server_name": sni,
                    "alpn": alpnArray
                };

                if (isReality) {
                    tlsSettings.reality = {
                        "enabled": true,
                        "public_key": pbk,
                        "short_id": sid
                    };
                    tlsSettings.utls = {
                        "enabled": true,
                        "fingerprint": fp
                    };
                } else if (isTls) {
                    if (params.has('allowInsecure')) {
                        tlsSettings.insecure = (params.get('allowInsecure') === '1');
                    }
                    if (params.has('fp')) {
                        tlsSettings.utls = {
                            "enabled": true,
                            "fingerprint": fp
                        };
                    }
                }

                const transportSettings = {
                    "type": type,
                    "path": path,
                    "mode": mode,
                    "x_padding_bytes": xPaddingBytes
                };
                if (host) {
                    transportSettings.host = host;
                }

                // Parse extra parameter (JSON with additional transport settings)
                const extraRaw = params.get('extra');
                if (extraRaw) {
                    try {
                        const extra = JSON.parse(decodeURIComponent(extraRaw));

                        // x_padding_bytes from extra overrides URL param
                        if (extra.xPaddingBytes !== undefined) {
                            transportSettings.x_padding_bytes = String(extra.xPaddingBytes);
                        }

                        // no_grpc_header (stream-up/one, client only)
                        if (extra.noGRPCHeader !== undefined) {
                            transportSettings.no_grpc_header = extra.noGRPCHeader;
                        }

                        // sc_max_each_post_bytes (packet-up only)
                        if (extra.scMaxEachPostBytes !== undefined) {
                            transportSettings.sc_max_each_post_bytes = extra.scMaxEachPostBytes;
                        }

                        // sc_min_posts_interval_ms (packet-up, client only)
                        if (extra.scMinPostsIntervalMs !== undefined) {
                            transportSettings.sc_min_posts_interval_ms = extra.scMinPostsIntervalMs;
                        }

                        // sc_stream_up_server_secs
                        if (extra.scStreamUpServerSecs !== undefined) {
                            transportSettings.sc_stream_up_server_secs = String(extra.scStreamUpServerSecs);
                        }

                        // xmux (h2/h3, client only)
                        if (extra.xmux && typeof extra.xmux === 'object') {
                            const xmux = {};
                            if (extra.xmux.maxConcurrency !== undefined) {
                                xmux.max_concurrency = String(extra.xmux.maxConcurrency);
                            }
                            if (extra.xmux.maxConnections !== undefined) {
                                xmux.max_connections = extra.xmux.maxConnections;
                            }
                            if (extra.xmux.cMaxReuseTimes !== undefined) {
                                xmux.c_max_reuse_times = extra.xmux.cMaxReuseTimes;
                            }
                            if (extra.xmux.hMaxRequestTimes !== undefined) {
                                xmux.h_max_request_times = String(extra.xmux.hMaxRequestTimes);
                            }
                            if (extra.xmux.hMaxReusableSecs !== undefined) {
                                xmux.h_max_reusable_secs = String(extra.xmux.hMaxReusableSecs);
                            }
                            if (extra.xmux.hKeepAlivePeriod !== undefined) {
                                xmux.h_keep_alive_period = extra.xmux.hKeepAlivePeriod;
                            }
                            if (Object.keys(xmux).length > 0) {
                                transportSettings.xmux = xmux;
                            }
                        }
                    } catch (extraErr) {
                        // Ignore malformed extra JSON
                    }
                }

                const config = {
                    "type": "vless",
                    "tag": tag,
                    "server": server,
                    "server_port": port,
                    "uuid": uuid,
                    "tls": tlsSettings,
                    "transport": transportSettings
                };

                outputElement.innerHTML = syntaxHighlight(config);

                // Show stats
                const secLabel = isReality ? 'Reality' : isTls ? 'TLS' : 'None';
                statsBar.innerHTML = `
                    <span class="stat-chip"><span class="dot dot-green"></span>${secLabel}</span>
                    <span class="stat-chip"><span class="dot dot-purple"></span>${type.toUpperCase()}</span>
                    <span class="stat-chip"><span class="dot dot-amber"></span>Port ${port}</span>
                    <span class="stat-chip"><span class="dot dot-cyan"></span>${mode}</span>
                `;
                statsBar.classList.add('visible');

            } catch (e) {
                outputElement.innerHTML = '<span class="error-text">❌ Ошибка парсинга: ' + e.message + '</span>';
                statsBar.classList.remove('visible');
            }
        }

        function copyJSON() {
            const pre = document.getElementById('jsonOutput');
            if (pre.querySelector('.placeholder-text') || pre.querySelector('.error-text')) return;

            const text = pre.innerText;
            const toast = document.getElementById('toast');

            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copyBtn');
                const copyText = document.getElementById('copyText');
                btn.classList.add('copied');
                copyText.textContent = 'Скопировано!';

                toast.classList.add('show');

                setTimeout(() => {
                    btn.classList.remove('copied');
                    copyText.textContent = 'Копировать';
                    toast.classList.remove('show');
                }, 2000);
            }).catch(() => {
                const copyText = document.getElementById('copyText');
                copyText.textContent = 'Ошибка';
                setTimeout(() => { copyText.textContent = 'Копировать'; }, 2000);
            });
        }

        function syntaxHighlight(json) {
            if (typeof json != 'string') json = JSON.stringify(json, undefined, 2);
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(
                /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
                function (match) {
                    let cls = 'number';
                    if (/^"/.test(match)) {
                        if (/:$/.test(match)) cls = 'key';
                        else cls = 'string';
                    } else if (/true|false/.test(match)) {
                        cls = 'boolean';
                    } else if (/null/.test(match)) {
                        cls = 'null';
                    }
                    return '<span class="' + cls + '">' + match + '</span>';
                }
            );
        }

        // Enter to convert
        document.getElementById('urlInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                convertURL();
            }
        });
    </script>
</body>

</html>
